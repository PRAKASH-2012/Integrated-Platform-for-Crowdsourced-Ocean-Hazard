<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - OceanShield AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem 0; background: radial-gradient(circle at 50% 30%, rgba(0, 242, 254, 0.15) 0%, #030a16 70%);">

  <div class="container" style="max-width: 480px; width: 100%;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <a href="index.html" class="brand-logo" style="justify-content: center; font-size: 1.8rem; margin-bottom: 0.5rem;">
        <i class="fa-solid fa-shield-halved"></i>
        <span>OceanShield AI</span>
      </a>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Register as Citizen, Officer or Rescue Personnel</p>
    </div>

    <div class="glass-card" style="padding: 2rem;">
      <form id="signup-form">
        
        <div style="margin-bottom: 1rem;">
          <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Full Name</label>
          <input type="text" id="signup-name" required placeholder="Enter your name" style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; margin-top: 0.3rem;">
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Official / Personal Email</label>
          <input type="email" id="signup-email" required placeholder="Enter your mail" style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; margin-top: 0.3rem;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Select Role</label>
            <select id="signup-role" style="width: 100%; padding: 0.75rem 0.5rem; background: #030a16; border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; margin-top: 0.3rem;">
              <option value="Citizen">Citizen / Volunteer</option>
              <option value="Government Officer">Government Officer</option>
              <option value="Rescue Team">Rescue Team / Coast Guard</option>
              <option value="Admin">System Admin</option>
            </select>
          </div>

          <div>
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Coastal District</label>
            <select id="signup-district" style="width: 100%; padding: 0.75rem 0.5rem; background: #030a16; border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; margin-top: 0.3rem;">
              <option value="Chennai">Chennai (TN)</option>
              <option value="Visakhapatnam">Visakhapatnam (AP)</option>
              <option value="Kochi">Kochi (KL)</option>
              <option value="Mumbai">Mumbai (MH)</option>
              <option value="Puri">Puri (OD)</option>
            </select>
          </div>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Password</label>
          <input type="password" id="signup-password" required placeholder="••••••••" style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; margin-top: 0.3rem;">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
          <i class="fa-solid fa-user-plus"></i> Complete Registration
        </button>
      </form>

      <p style="text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 1.5rem;">
        Already registered? <a href="login.html" style="font-weight: 700;">Sign In Here</a>
      </p>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('signup-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const userData = {
        name: document.getElementById('signup-name').value,
        email: document.getElementById('signup-email').value,
        role: document.getElementById('signup-role').value,
        district: document.getElementById('signup-district').value,
        state: 'India'
      };

      if (Auth.signup(userData)) {
        setTimeout(() => window.location.href = 'dashboard.html', 700);
      }
    });
  </script>
</body>
</html>
