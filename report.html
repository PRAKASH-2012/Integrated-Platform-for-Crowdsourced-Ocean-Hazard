<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Ocean Hazard Reporting - OceanShield AI</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-shield-halved"></i>
        <span>OceanShield AI</span>
      </a>

      <ul class="nav-links" id="nav-links">
        <li><a href="dashboard.html" class="nav-link"><i class="fa-solid fa-gauge-high"></i> Dashboard</a></li>
        <li><a href="map.html" class="nav-link"><i class="fa-solid fa-map-location-dot"></i> Live GIS Map</a></li>
        <li><a href="report.html" class="nav-link active"><i class="fa-solid fa-camera"></i> Report Hazard</a></li>
        <li><a href="analytics.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Analytics</a></li>
        <li><a href="weather.html" class="nav-link"><i class="fa-solid fa-cloud-sun-rain"></i> Weather</a></li>
      </ul>

      <div class="nav-actions">
        <button id="theme-toggle-btn" class="btn btn-outline btn-sm"><i class="fa-solid fa-sun"></i></button>
        <div id="nav-user-profile"></div>
        <button class="mobile-menu-btn" id="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </nav>

  <main class="container dashboard-wrapper" style="max-width: 900px;">
    <div class="dashboard-header">
      <div>
        <h2 class="text-gradient"><i class="fa-solid fa-triangle-exclamation"></i> AI Powered Crowdsourced Hazard Reporting</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Upload Photos, Videos or Voice • Instant AI Computer Vision Verification • GPS Lock</p>
      </div>
    </div>

    <div class="glass-card command-panel" style="padding: 2rem;">
      <form id="hazard-report-form">
        
        <!-- Media Upload & AI Computer Vision Scanner -->
        <div style="margin-bottom: 2rem;">
          <label style="font-size: 0.9rem; font-weight: 700; color: var(--cyan-primary); display: block; margin-bottom: 0.5rem;">
            Step 1: Upload Photo / Video of Hazard
          </label>
          
          <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 250px;">
              <input type="file" id="report-image-input" accept="image/*,video/*" style="display: none;">
              <label for="report-image-input" class="action-tile" style="cursor: pointer; padding: 2rem; border-style: dashed; width: 100%;">
                <i class="fa-solid fa-cloud-arrow-up" style="font-size: 2.5rem;"></i>
                <span>Click to Upload Hazard Photo or Video</span>
                <span style="font-size: 0.75rem; color: var(--text-dim);">Supports JPG, PNG, MP4 (Max 25MB)</span>
              </label>
            </div>

            <!-- Image Preview Box -->
            <div id="report-media-preview-container" style="display: none; width: 200px; height: 160px; position: relative;">
              <img id="report-media-preview" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border-glow);">
            </div>
          </div>

          <!-- AI Scanner Animation Output Box -->
          <div id="ai-scanner-box" class="ai-scan-box" style="display: none; margin-top: 1.25rem;">
            <div class="ai-scan-line"></div>
            <div id="ai-scan-results"></div>
          </div>
        </div>

        <!-- Form Controls -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Hazard Category (15+ Supported)</label>
            <select id="report-hazard-type" style="width: 100%; padding: 0.75rem; background: #030a16; border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; margin-top: 0.3rem;"></select>
          </div>

          <div>
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Perceived Severity</label>
            <select id="report-severity" style="width: 100%; padding: 0.75rem; background: #030a16; border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; margin-top: 0.3rem;">
              <option value="Critical">Critical (Immediate Danger)</option>
              <option value="High" selected>High (High Waves / Damage)</option>
              <option value="Medium">Medium (Caution Required)</option>
              <option value="Low">Low (Informational)</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Location Landmark Name</label>
            <input type="text" id="report-location-name" value="Marina Beach Light House Promenade, Chennai" required style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; margin-top: 0.3rem;">
          </div>

          <div>
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">District</label>
            <select id="report-district" style="width: 100%; padding: 0.75rem; background: #030a16; border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; margin-top: 0.3rem;">
              <option value="Chennai">Chennai</option>
              <option value="Visakhapatnam">Visakhapatnam</option>
              <option value="Kochi">Kochi</option>
              <option value="Mumbai">Mumbai</option>
              <option value="Puri">Puri</option>
            </select>
          </div>
        </div>

        <!-- Hidden GPS Lat/Lng -->
        <input type="hidden" id="report-lat" value="13.0475">
        <input type="hidden" id="report-lng" value="80.2824">
        <input type="hidden" id="report-ai-confidence" value="94">

        <div style="margin-bottom: 1.25rem; font-size: 0.8rem; color: var(--cyan-primary);">
          <i class="fa-solid fa-location-crosshairs"></i> <span id="gps-status-text">Satellite GPS coordinates locked.</span>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Detailed Description & Observations</label>
          <textarea id="report-description" rows="3" placeholder="Describe wave swell height, wind intensity, stranded vessels or damage..." style="width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; margin-top: 0.3rem;">High sea swells over 4 meters spilling onto beach loop road. Locals being advised to stay clear of water.</textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1.05rem;">
          <i class="fa-solid fa-paper-plane"></i> Submit Verified Hazard Report
        </button>
      </form>
    </div>
  </main>

  <!-- Core Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
  <script src="js/report.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
